<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-labelledby="title">
  <title id="title">Laser-etched PCB interconnect divider</title>
  <style>@media (prefers-reduced-motion: reduce) { .motion-only { display: none; } }</style>
  <defs>
    <linearGradient id="trace"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".25" stop-color="#22d3ee" stop-opacity=".6"/><stop offset=".75" stop-color="#a99bff" stop-opacity=".6"/><stop offset="1" stop-color="#a99bff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-200%" width="300%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="trace-path" d="M0 16H330L342 4H510L522 16H678L690 28H858L870 16H1200"/>
  </defs>
  <use href="#trace-path" fill="none" stroke="url(#trace)" stroke-width="1"/>
  <path d="M0 23H323L335 11H501M699 21H851L863 9H1200" fill="none" stroke="#274157" stroke-width=".6"/>
  <g fill="#010409" stroke="#a77a4d" stroke-width="1"><circle cx="330" cy="16" r="3"/><circle cx="510" cy="4" r="3"/><circle cx="690" cy="28" r="3"/><circle cx="870" cy="16" r="3"/></g>
  <g class="motion-only">
    <use href="#trace-path" fill="none" stroke="#4fdaed" stroke-width="1.5" stroke-dasharray="18 1280" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="1300;-1300" dur="9s" repeatCount="indefinite"/></use>
    <circle r="2.2" fill="#c4fbff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#trace-path"/></animateMotion></circle>
    <circle r="1.8" fill="#b7a9ff" filter="url(#glow)"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#trace-path"/></animateMotion></circle>
  </g>
</svg>
